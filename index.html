<script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>
<style>
/* Punti cliccabili del tour (usati da viewer ed editor) */
.hs-door, .hs-detail {
  width: 44px; height: 44px;
  border-radius: 50%; cursor: pointer; box-sizing: border-box;
  border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.35), 0 4px 14px rgba(0,0,0,.5);
  display: flex; align-items: center; justify-content: center;
}
.hs-door { background: rgba(230, 120, 30, .9); animation: hs-pulse 1.8s infinite; }
.hs-detail { background: rgba(30, 110, 200, .9); width: 34px; height: 34px; }

/* freccia per le porte, "i" per i dettagli */
.hs-door::before {
  content: ""; width: 0; height: 0;
  border-left: 9px solid transparent; border-right: 9px solid transparent;
  border-bottom: 13px solid #fff; margin-top: -3px;
}
.hs-detail::before { content: "i"; color: #fff; font: bold 17px/1 Georgia, serif; }
/* dettaglio pagina web: cerchio verde con freccia "apri" */
.hs-detail.hs-web { background: rgba(30, 140, 70, .92); }
.hs-detail.hs-web::before { content: "↗"; font: bold 18px/1 system-ui, sans-serif; color: #fff; }

/* dettaglio video: cerchio viola con triangolo "play" */
.hs-detail.hs-video { background: rgba(140, 50, 190, .92); }
.hs-detail.hs-video::before {
  content: ""; width: 0; height: 0; margin-left: 3px;
  border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 11px solid #fff;
}

@keyframes hs-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(230,120,30,.7), 0 4px 14px rgba(0,0,0,.5); }
  70%  { box-shadow: 0 0 0 16px rgba(230,120,30,0), 0 4px 14px rgba(0,0,0,.5); }
  100% { box-shadow: 0 0 0 0 rgba(230,120,30,0), 0 4px 14px rgba(0,0,0,.5); }
}

/* Etichetta al passaggio del mouse (struttura tooltip di Pannellum) */
.hs-door span, .hs-detail span {
  visibility: hidden; position: absolute; bottom: 52px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,.8); color: #fff; padding: 5px 10px; border-radius: 6px;
  font: 13px system-ui, sans-serif; white-space: nowrap; pointer-events: none;
}
.hs-door:hover span, .hs-detail:hover span { visibility: visible; }
.hs-detail span { bottom: 42px; }
/* annulla lo spostamento che Pannellum applica alle etichette */
.hs-door.pnlm-tooltip span, .hs-detail.pnlm-tooltip span { margin-left: 0 !important; }

/* evidenziazione nell'editor */
.hs-selected { outline: 4px solid #ffe14a; outline-offset: 3px; }
</style>
<style>
  html, body { margin: 0; height: 100%; background: #111; font-family: system-ui, sans-serif; }
  #pano { position: fixed; inset: 0; }
  #bar {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: rgba(0,0,0,.55); backdrop-filter: blur(6px); z-index: 5;
    max-width: calc(100vw - 32px); overflow-x: auto;
  }
  #bar button {
    border: 0; border-radius: 999px; padding: 8px 14px; cursor: pointer;
    background: transparent; color: #fff; font-size: 14px; white-space: nowrap;
  }
  #bar button.active { background: #fff; color: #111; }
  #heading {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 5;
    color: #fff; background: rgba(0,0,0,.55); padding: 6px 14px; border-radius: 8px;
    font-size: 15px; pointer-events: none; white-space: nowrap;
    max-width: calc(100vw - 110px); overflow: hidden; text-overflow: ellipsis;
  }
  #modal {
    position: fixed; inset: 0; z-index: 20; display: none;
    background: rgba(0,0,0,.85); align-items: center; justify-content: center; padding: 16px;
  }
  #modal.open { display: flex; }
  #modal .card {
    background: #fff; color: #1d1d1b; border-radius: 10px; overflow: hidden;
    width: min(720px, 100%); max-height: calc(100vh - 32px);
    display: flex; flex-direction: column; box-shadow: 0 12px 50px #000;
  }
  #modal .imgwrap { background: #111; display: flex; justify-content: center; flex: 1 1 auto; min-height: 0; }
  #modal img, #modal video { max-width: 100%; max-height: 70vh; object-fit: contain; display: block; }
  #modal video { width: 100%; background: #000; }
  #modal [hidden] { display: none !important; }
  #modal .card.wide { width: min(1100px, 100%); }
  #modal iframe { width: 100%; height: 70vh; border: 0; background: #fff; display: block; }
  #modal .weblink { display: inline-block; margin-top: 10px; color: #1e6ec8; font-weight: 600; text-decoration: none; }
  #modal .weblink:hover { text-decoration: underline; }
  #modal .webbtn {
    display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px;
    background: #1e8c46; color: #fff; font-weight: 600; text-decoration: none;
  }
  #modal .webbtn:hover { background: #17733a; }
  #modal .webnote { margin-top: 8px; font-size: 13px; color: #6b6b66; }
  #modal .text { padding: 14px 18px 18px; overflow-y: auto; }
  #modal .text h3 { margin: 0 0 6px; font-size: 17px; }
  #modal .text p { margin: 0; line-height: 1.5; white-space: pre-wrap; color: #3a3a36; }
  #modal .text:empty { display: none; }
  #modal .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  #modal .head h3 { margin: 0; }
  #modal .listen {
    flex: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    border: 0; border-radius: 999px; padding: 7px 14px 7px 10px; font: 600 14px system-ui, sans-serif;
    background: #d9731e; color: #fff;
  }
  #modal .listen:hover { background: #bf6214; }
  #modal .listen:disabled { opacity: .7; cursor: wait; }
  #modal .listen .ico { width: 22px; height: 22px; border-radius: 50%; background: rgba(255,255,255,.25);
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  #modal .close {
    position: absolute; top: 10px; right: 14px; color: #fff; font-size: 34px; line-height: 1;
    background: none; border: 0; cursor: pointer;
  }
  #error { color: #fff; padding: 24px; }
  .pnlm-panorama-info { display: none !important; } /* il titolo è già in alto */
</style>
</head>

 marito, Edoardo Dino Sacerdoti. Lì nacquero i figli Guido, Franco e Paola, e lì morì nel 1985. Espose di rado: la sua prima mostra personale fu nel 1959, alla Galleria del Ponte di Napoli. Dipinse soprattutto ritratti, paesaggi e nature morte, come il ritratto e la natura morta di questa parete, con colori pieni e una pennellata vicina a quella di Carlo.","pitch":-1.1496478615780603,"yaw":-135.75166989907967,"media":"image","label":"Lelle Levi Sacerdoti","audio":"media/26bcbeac81faebf2.mp3"},{"kind":"detail","src":"media/dettaglio_2_stanza_2.jpeg","description":"Ulivi contorti, vigne, alberi carichi di frutti. Sono i paesaggi della Liguria intorno a Villa Levi, la casa di famiglia ad Alassio, con il suo giardino di agavi, carrubi e ulivi. Questi alberi tornano spesso nei quadri di Lelle e di suo figlio Guido, che li dipinse fin da ragazzo sotto la guida dello zio Carlo. Proprio Carlo Levi scrisse che quelli della sorella sono paesaggi del cuore: la vecchia casa di Alassio, gli ulivi e i cipressi dell'infanzia.","pitch":0.33084084495561605,"yaw":2.8087416050737666,"media":"image","label":"I paesaggi di Alassio","audio":"media/8644bd73c255b626.mp3"}]},{"id":"stanza_3","title":"SALA 3","yaw":-95.6202706428162,"pitch":-5.371429317016187,"hfov":100,"image":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0aHBwgJC4nICIsIxwcKDcpLDAxNDQ0Hyc5PTgyPC4zNDL/2wBDAQkJCQwLDBgNDRgyIRwhMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjIyMjL/wgARCAMgBkADASIAAhEBAxEB/8QAGgABAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EABgBAQEBAQEAAAAAAAAAAAAAAAABAgME/9oADAMBAAIQAxAAAAL4qsbiiATQyoiiAFIoiiLAoi0y0MtDLYw2MNjDYw2MNjDYxdDLQxdDLQyoiiKIoiwAiwAAAAAAKI0MtjDdOboOboOboOboOboObqOTqOTqOTqOTqOU6jk6jk6jleg5ug5ug5ug5ug5tjDYw2MNjDYw3DLQy0MqIoiiKIoiiKIolAAAAAAAAAAAAAAAoiiKIAAAUigoiwsUSiKM1CgILFJVJYKlCCojTIqC3KqgqAAABKIoiwASiLAAsBSKIoi6MOlOV6jndjNolgqCoKAQAEKzDbmOkwN3kOs503eY6XlDtOY6uI7ONOrjTq5Dq5DoxDowNzI1cigUAIsAAKgoEok0MTqOLrDm1AAAoiiLABKAKlAAAEojQzaIoyo getto della tomba dello zio e contribuì a scegliere le opere oggi esposte nella Pinacoteca Carlo Levi. Già in vita aveva espresso il desiderio di donare i suoi quadri alla comunità di Aliano.","pitch":1.281275608127102,"yaw":45.92233471014097,"label":"Guido Sacerdoti","src":"media/dettaglio_1_stanza_3.jpeg","media":"image","audio":"media/8d409a2976f3410b.mp3"},{"kind":"detail","src":"media/dettaglio_1_stanza_2.jpeg","description":"Il lessico familiare passa anche attraverso i ritratti. In questa famiglia di pittori i volti dei parenti tornano di continuo: Carlo Levi ritrasse più volte la sorella Lelle, Lelle dipinse il figlio Guido, e Guido a sua volta ritrasse la madre e i suoi cari. In queste tele i colori intensi e le pennellate fitte avvolgono le figure come un mare in movimento. Si vede quanto la lezione di Carlo Levi sia stata raccolta e trasformata in uno stile personale.","pitch":-0.503392882500977,"yaw":176.42161619235927,"media":"image","label":"Ritratti di famiglia","audio":"media/77bf2062298167b5.mp3"},{"kind":"detail","src":"media/dettaglio_2_stanza_3.jpeg","description":"Gli ulivi secolari sono uno dei temi preferiti di Guido Sacerdoti. I tronchi nodosi e contorti, quasi come figure umane, riempiono la tela insieme al verde del giardino, alle anfore e alle pietre. È la stessa natura ligure amata dalla madre e dallo zio, dipinta però con una pennellata più densa e inquieta. Carlo Sacerdoti, figlio di Guido, ha ricordato che la nonna e il padre hanno lasciato migliaia di quadri, e oggi li fa conoscere con mostre a Napoli, Matera e Alassio.","pitch":1.5226157390671693,"yaw":80.03396098695384,"media":"image","label":"Ulivi e giardini","audio":"media/cd855a870dcc1987.mp3"}]}]};</script>
<script>
const modal = document.getElementById('modal');
const modalImg = modal.querySelector('img');
const modalVideo = modal.querySelector('video');
const modalFrame = modal.querySelector('iframe');
const modalWrap = modal.querySelector('.imgwrap');
const modalCard = modal.querySelector('.card');
const modalText = modal.querySelector('.text');
/* ---------- lettura vocale della descrizione ---------- */
const narr = new Audio();
let narrBtn = null;
function setListen(state) { // 'idle' | 'loading' | 'playing'
  if (!narrBtn) return;
  narrBtn.disabled = state === 'loading';
  narrBtn.innerHTML = state === 'playing' ? '<span class="ico">❚❚</span>Pausa'
    : state === 'loading' ? '<span class="ico">…</span>Preparo la voce'
    : '<span class="ico">▶</span>Ascolta';
  narrBtn.setAttribute('aria-label', state === 'playing' ? 'Metti in pausa la lettura' : 'Ascolta la descrizione');
}
narr.addEventListener('play', () => { modalVideo.pause(); setListen('playing'); }); // una voce alla volta
narr.addEventListener('pause', () => setListen('idle'));
narr.addEventListener('ended', () => { narr.currentTime = 0; setListen('idle'); });
modalVideo.addEventListener('play', () => narr.pause());
function stopNarration() { narr.pause(); narr.removeAttribute('src'); narr.load(); narrBtn = null; }
// versione pubblica: l'audio è già pronto (h.audio); in locale lo genera il server alla prima richiesta
const canGenerate = !window.TOUR_DATA && location.protocol.startsWith('http');
async function narrationSrc(h) {
  if (h.audio) return h.audio;
  if (!canGenerate) return null;
  const r = await fetch('/api/tts', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                      body: JSON.stringify({ text: h.description }) });
  const res = await r.json();
  if (!r.ok || !res.path) throw new Error(res.error || r.status);
  return res.path; // non salvato in h: se la descrizione cambia, si rigenera
}
async function toggleNarration(h) {
  if (!narr.paused) { narr.pause(); return; }
  if (narr.getAttribute('src')) { narr.play().catch(() => setListen('idle')); return; }
  setListen('loading');
  try {
    const src = await narrationSrc(h);
    if (!src) { setListen('idle'); return; }
    narr.src = src;
    await narr.play();
  } catch (e) {
    console.error(e);
    setListen('idle');
    if (narrBtn) narrBtn.title = 'Audio non disponibile';
  }
}
function headWithListen(h, title) {
  const hasVoice = h.description && (h.audio || canGenerate);
  return hasVoice ? `<div class="head">${title || '<span></span>'}<button class="listen" type="button"></button></div>` : title;
}
function wireListen(h) {
  narrBtn = modalText.querySelector('.listen');
  if (!narrBtn) return;
  setListen('idle');
  narrBtn.addEventListener('click', e => { e.stopPropagation(); toggleNarration(h); });
}

function closeModal() {
  modal.classList.remove('open');
  stopNarration();
  modalVideo.pause(); modalVideo.removeAttribute('src'); modalVideo.load(); // ferma il video
  modalFrame.removeAttribute('src'); // chiude la pagina web (ferma anche audio/video al suo interno)
}
// YouTube e Vimeo: la pagina normale non si può incorporare, il "player" sì
function embedUrl(url) {
  try {
    const u = new URL(url);
    const host = u.hostname.replace(/^www\.|^m\./, '');
    let id = '';
    if (host === 'youtube.com' && u.pathname === '/watch') id = u.searchParams.get('v');
    else if (host === 'youtu.be') id = u.pathname.slice(1);
    else if (host === 'youtube.com' && u.pathname.startsWith('/shorts/')) id = u.pathname.split('/')[2];
    if (id) return 'https://www.youtube.com/embed/' + encodeURIComponent(id);
    if (host === 'vimeo.com' && /^\/\d+/.test(u.pathname)) return 'https://player.vimeo.com/video/' + u.pathname.split('/')[1];
  } catch (_) {}
  return url;
}
const safeUrl = u => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (_) { return ''; } };
// chiude cliccando fuori dalla scheda o sulla X
modal.addEventListener('click', e => { if (!e.target.closest('.card') || e.target.closest('.close')) closeModal(); });
modal.querySelector('.close').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const isVideo = p => /\.(mp4|m4v|webm)$/i.test(p || '');
function openDetail(ev, h) {
  const src = h.src || h.image; // "image" = formato dei punti più vecchi
  stopNarration();
  const title = headWithListen(h, h.label ? `<h3>${esc(h.label)}</h3>` : '');
  const desc = h.description ? `<p>${esc(h.description)}</p>` : '';
  modalImg.hidden = modalVideo.hidden = modalFrame.hidden = true;
  modalWrap.hidden = false;
  modalCard.classList.remove('wide');

  if (h.media === 'web') {
    const url = safeUrl(h.url);
    const link = url ? `<a class="weblink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Apri in una nuova scheda ↗</a>` : '';
    if (url && h.embeddable !== false) {
      // pagina mostrata dentro la scheda
      modalCard.classList.add('wide');
      modalFrame.hidden = false; modalFrame.src = embedUrl(url);
      modalText.innerHTML = title + desc + link;
    } else {
      // il sito non si lascia incorporare: pulsante per aprirlo a parte
      modalWrap.hidden = true;
      modalText.innerHTML = title + desc +
        (url ? `<a class="webbtn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Apri la pagina ↗</a>
                <div class="webnote">${esc(new URL(url).hostname)} si apre in una nuova scheda.</div>` : '');
    }
  } else if (isVideo(src)) {
    modalImg.removeAttribute('src');
    modalVideo.hidden = false; modalVideo.src = src;
    modalVideo.play().catch(() => {}); // se il browser blocca l'avvio automatico, resta il tasto play
    modalText.innerHTML = title + desc;
  } else {
    modalImg.hidden = false; modalImg.src = src;
    modalText.innerHTML = title + desc;
  }
  wireListen(h);
  modal.classList.add('open');
}

function buildConfig(tour) {
  const scenes = {};
  const titles = Object.fromEntries(tour.scenes.map(s => [s.id, s.title]));
  for (const s of tour.scenes) {
    scenes[s.id] = {
      type: 'equirectangular',
      panorama: s.image,
      title: s.title,
      yaw: s.yaw, pitch: s.pitch, hfov: s.hfov || 100,
      hotSpots: s.hotspots.map(h => h.kind === 'door'
        ? { pitch: h.pitch, yaw: h.yaw, type: 'scene', sceneId: h.to,
            text: h.label || ('Vai a ' + (titles[h.to] || h.to)), cssClass: 'hs-door' }
        : { pitch: h.pitch, yaw: h.yaw, type: 'info',
            text: h.label || (h.media === 'web' ? 'Pagina web' : isVideo(h.src) ? 'Video' : 'Dettaglio'),
            cssClass: 'hs-detail' + (h.media === 'web' ? ' hs-web' : isVideo(h.src) ? ' hs-video' : ''),
            clickHandlerFunc: openDetail, clickHandlerArgs: h })
    };
  }
  return {
    default: {
      firstScene: tour.firstScene, autoLoad: true, sceneFadeDuration: 800,
      showControls: true, compass: false
    },
    scenes
  };
}

// versione pubblica: i dati sono già nella pagina (window.TOUR_DATA); in locale si leggono da tour.json
(window.TOUR_DATA ? Promise.resolve(window.TOUR_DATA) : fetch('tour.json').then(r => r.json())).then(tour => {
  document.title = tour.title || 'Tour 360';
  const viewer = pannellum.viewer('pano', buildConfig(tour));
  const bar = document.getElementById('bar');
  const heading = document.getElementById('heading');

  for (const s of tour.scenes) {
    const b = document.createElement('button');
    b.textContent = s.title;
    b.dataset.id = s.id;
    b.onclick = () => viewer.loadScene(s.id);
    bar.appendChild(b);
  }
  function mark() {
    const id = viewer.getScene();
    const s = tour.scenes.find(x => x.id === id);
    heading.textContent = (tour.title ? tour.title + ' · ' : '') + (s ? s.title : '');
    bar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === id));
  }
  viewer.on('scenechange', mark);
  viewer.on('load', mark);
  mark();
}).catch(err => {
  document.getElementById('pano').innerHTML =
    '<p id="error">Impossibile caricare tour.json. Non aprire il file con doppio clic: fai doppio clic su <b>AVVIA_TOUR.bat</b> nella cartella del tour, poi apri http://127.0.0.1:8360</p>';
  console.error(err);
});
</script>
